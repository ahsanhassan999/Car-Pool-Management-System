<!DOCTYPE html>
<html>
<head>
  <title>AI Chat</title>
  <style>
    body { font-family: sans-serif; }
    #chat { max-width: 500px; margin: 40px auto; }
    .msg { padding: 8px; border-radius: 8px; margin-bottom: 8px; }
    .user { background: #d1e7ff; text-align: right; }
    .bot { background: #f0f0f0; text-align: left; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <div style="max-width: 500px; margin: auto;">
    <input id="input" style="width: 80%;" placeholder="Ask me something..." />
    <button onclick="sendMsg()">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const webhookURL = 'https://interpretive-dwana-electromechanical.ngrok-free.dev/webhook-test/cc69c40d-1a4c-48ce-8ffe-78987f9a3fbe'; // your n8n webhook URL

    async function sendMsg() {
      const text = document.getElementById('input').value;
      if (!text) return;
      addMessage(text, 'user');
      document.getElementById('input').value = '';

      const res = await fetch(webhookURL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();
      addMessage(data.response || JSON.stringify(data), 'bot');
    }

    function addMessage(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
