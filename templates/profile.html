<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Profile - CarPool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --sidebar-width: 250px;
            --navbar-height: 60px;
            --primary-color: #6366f1;
            --sidebar-bg: #1e293b;
            --sidebar-hover: #334155;
        }
        body { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f8fafc; }
        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            position: fixed; top: 0; left: 0; bottom: 0;
            overflow-y: auto; transition: width 0.3s ease, transform 0.3s ease; z-index: 1001;
        }
        .sidebar.collapsed { width: 70px; }
        .sidebar.mobile-open { transform: translateX(0); }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } }
        .sidebar-brand { height: var(--navbar-height); display:flex; align-items:center; padding:0 20px; color:#fff; font-size:1.25rem; font-weight:700; border-bottom:1px solid #334155; }
        .sidebar-brand i { font-size: 1.5rem; margin-right: 12px; }
        .sidebar.collapsed .sidebar-brand span { display:none; }
        .sidebar.collapsed .sidebar-brand { justify-content:center; padding:0; }
        .sidebar.collapsed .sidebar-brand i { margin-right: 0; }
        .sidebar-menu { padding: 20px 0; }
        .menu-item { padding:12px 20px; color:#cbd5e1; display:flex; align-items:center; gap:12px; text-decoration:none; border-radius:8px; margin:4px 10px; transition:all 0.2s; }
        .menu-item:hover { background: var(--sidebar-hover); color:#fff; }
        .menu-item.active { background: var(--primary-color); color:#fff; }
        /* Topbar */
        .top-navbar { height: var(--navbar-height); background:#fff; border-bottom:1px solid #e2e8f0; position: fixed; top: 0; left: var(--sidebar-width); right: 0; z-index: 1000; transition:left 0.3s ease; }
        .top-navbar.sidebar-collapsed { left: 70px; }
        .sidebar-toggle { background:#f1f5f9; border:1px solid #e2e8f0; color:#334155; padding:8px 10px; border-radius:10px; cursor:pointer; transition:all 0.2s; }
        .sidebar-toggle:hover { background:#e2e8f0; color:var(--primary-color); }
        .sidebar-toggle.active { background: var(--primary-color); color:#fff; border-color: var(--primary-color); }
        .user-profile { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:10px; cursor:pointer; }
        .user-profile:hover { background:#f1f5f9; }
        .user-avatar { width:38px; height:38px; border-radius:50%; background:var(--primary-color); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; }
        /* Main */
        .main-content { margin-left: var(--sidebar-width); margin-top: var(--navbar-height); padding: 20px; transition: margin-left 0.3s ease; }
        .main-content.sidebar-collapsed { margin-left: 70px; }
        .page-header { background:#fff; padding:16px; border-radius:12px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
        /* Profile Card */
        .profile-card { background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
        .profile-cover { background: linear-gradient(90deg, #6366f1, #22c55e); height: 120px; border-top-left-radius:12px; border-top-right-radius:12px; }
        .profile-body { padding: 16px; }
        .profile-avatar-lg { width: 84px; height: 84px; border-radius: 50%; background:#111827; color:#fff; display:flex; align-items:center; justify-content:center; font-size: 28px; font-weight:700; border: 4px solid #fff; margin-top: -42px; }
        .muted { color:#64748b; }
        /* Responsive tweaks */
        @media (max-width: 768px) {
            .profile-grid { display:block; }
            .stat { margin-bottom: 12px; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <a href="/" class="sidebar-brand text-decoration-none">
            <i class="bi bi-car-front-fill"></i>
            <span>CarPool</span>
        </a>
        <nav class="sidebar-menu">
            <a href="/driver-dashboard" class="menu-item"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
            <a href="/profile" class="menu-item active"><i class="bi bi-person"></i><span>My Profile</span></a>
            <a href="/logout" class="menu-item"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
        </nav>
    </aside>

    <!-- Top Navbar -->
    <nav class="top-navbar" id="topNavbar">
        <div class="container-fluid h-100">
            <div class="row h-100 align-items-center">
                <div class="col-auto">
                    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">
                        <i class="bi bi-list" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="col"></div>
                <div class="col-auto">
                    <div class="dropdown">
                        <div class="user-profile" data-bs-toggle="dropdown">
                            <div class="user-avatar">{{user_avatar}}</div>
                            <div class="d-none d-md-block">
                                <div class="fw-semibold">{{user_name}}</div>
                                <div class="small text-muted">{{user_role}}</div>
                            </div>
                            <i class="bi bi-chevron-down text-muted"></i>
                        </div>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i> My Profile</a></li>
                            <li><a class="dropdown-item text-danger" href="/logout"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="main-content" id="mainContent">
        <div class="page-header">
            <h5 class="mb-0">My Profile</h5>
        </div>

        <div class="profile-card">
            <div class="profile-cover"></div>
            <div class="profile-body">
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <div class="profile-avatar-lg">{{user_avatar}}</div>
                    <div>
                        <h5 class="mb-1">{{user.name}}</h5>
                        <div class="muted">{{user.role}}</div>
                    </div>
                </div>

                <hr class="my-4" />

                <div class="row g-3 profile-grid">
                    <div class="col-12 col-md-6">
                        <div class="p-3 border rounded-3 bg-white">
                            <div class="muted small mb-1">Email</div>
                            <div class="fw-semibold">{{user.email or '—'}}</div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="p-3 border rounded-3 bg-white">
                            <div class="muted small mb-1">Phone</div>
                            <div class="fw-semibold">{{user.phone_number or '—'}}</div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="p-3 border rounded-3 bg-white">
                            <div class="muted small mb-1">User ID</div>
                            <div class="fw-semibold">{{user.user_id}}</div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="p-3 border rounded-3 bg-white">
                            <div class="muted small mb-1">Role</div>
                            <div class="fw-semibold">{{user.role}}</div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-grid d-sm-flex gap-2">
                    <a href="/" class="btn btn-outline-secondary w-100 w-sm-auto"><i class="bi bi-arrow-left me-1"></i> Back</a>
                    <a href="#" class="btn btn-primary w-100 w-sm-auto"><i class="bi bi-pencil-square me-1"></i> Edit Profile</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sidebar interactions (match dashboards)
        const sidebar = document.getElementById('sidebar');
        const topNavbar = document.getElementById('topNavbar');
        const mainContent = document.getElementById('mainContent');
        const sidebarToggle = document.getElementById('sidebarToggle');
        
        sidebarToggle.addEventListener('click', () => {
            const icon = sidebarToggle.querySelector('i');
            if (window.innerWidth > 768) {
                const collapsed = !sidebar.classList.contains('collapsed');
                sidebar.classList.toggle('collapsed');
                topNavbar.classList.toggle('sidebar-collapsed');
                mainContent.classList.toggle('sidebar-collapsed');
                sidebarToggle.classList.toggle('active', collapsed);
                if (collapsed) {
                    icon.classList.remove('bi-list');
                    icon.classList.add('bi-chevron-double-right');
                    sidebarToggle.setAttribute('title', 'Expand sidebar');
                    sidebarToggle.setAttribute('aria-expanded', 'false');
                } else {
                    icon.classList.remove('bi-chevron-double-right');
                    icon.classList.add('bi-list');
                    sidebarToggle.setAttribute('title', 'Collapse sidebar');
                    sidebarToggle.setAttribute('aria-expanded', 'true');
                }
            } else {
                const opened = !sidebar.classList.contains('mobile-open');
                sidebar.classList.toggle('mobile-open');
                sidebarToggle.classList.toggle('active', opened);
                if (opened) {
                    icon.classList.remove('bi-list');
                    icon.classList.add('bi-x');
                    sidebarToggle.setAttribute('title', 'Close menu');
                    sidebarToggle.setAttribute('aria-expanded', 'true');
                } else {
                    icon.classList.remove('bi-x');
                    icon.classList.add('bi-list');
                    sidebarToggle.setAttribute('title', 'Open menu');
                    sidebarToggle.setAttribute('aria-expanded', 'false');
                }
            }
        });

        // Close sidebar on mobile when clicking outside
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && !sidebarToggle.contains(e.target)) {
                    sidebar.classList.remove('mobile-open');
                    const icon = sidebarToggle.querySelector('i');
                    icon.classList.remove('bi-x');
                    icon.classList.add('bi-list');
                }
            }
        });

        // Handle window resize to reset icon state
        window.addEventListener('resize', () => {
            const icon = sidebarToggle.querySelector('i');
            if (window.innerWidth > 768) {
                sidebar.classList.remove('mobile-open');
                if (sidebar.classList.contains('collapsed')) {
                    icon.classList.remove('bi-list','bi-x');
                    icon.classList.add('bi-chevron-double-right');
                } else {
                    icon.classList.remove('bi-chevron-double-right','bi-x');
                    icon.classList.add('bi-list');
                }
            } else {
                icon.classList.remove('bi-chevron-double-right');
                icon.classList.add(sidebar.classList.contains('mobile-open') ? 'bi-x' : 'bi-list');
            }
        });
    </script>
</body>
</html>
